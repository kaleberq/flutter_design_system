name: Create Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          dart-version: "3.9.2"

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Check if tag exists and increment if needed
        id: check_tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="v$VERSION"
          RELEASE_VERSION="$VERSION"

          # Check locally first
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists locally, incrementing version"
            TAG_EXISTS=true
          else
            # Check remotely using GitHub API
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG_NAME")
            
            if [ "$RESPONSE" = "200" ]; then
              echo "Tag $TAG_NAME already exists remotely, incrementing version"
              TAG_EXISTS=true
            else
              TAG_EXISTS=false
            fi
          fi

          # If tag exists, increment patch version
          if [ "$TAG_EXISTS" = "true" ]; then
            # Split version into parts (e.g., 0.0.1 -> 0 0 1)
            IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
            MAJOR="${VERSION_PARTS[0]}"
            MINOR="${VERSION_PARTS[1]}"
            PATCH="${VERSION_PARTS[2]}"
            
            # Increment patch version
            PATCH=$((PATCH + 1))
            RELEASE_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Incremented version: $VERSION -> $RELEASE_VERSION"
          fi

          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $RELEASE_VERSION"

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.check_tag.outputs.release_version }}
          release_name: v${{ steps.check_tag.outputs.release_version }}
          body: |
            ## Changes in this release

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Version: ${{ steps.check_tag.outputs.release_version }}

            Original version in pubspec.yaml: ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
