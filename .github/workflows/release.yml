name: Release Workflow

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find available version
        id: find_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          IFS='.' read -r -a PARTS <<< "$VERSION"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"

          while true; do
            TEST_VERSION="$MAJOR.$MINOR.$PATCH"
            TEST_TAG="v$TEST_VERSION"

            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TEST_TAG" 2>/dev/null)

            if [ "$RESPONSE" != "200" ]; then
              echo "release_version=$TEST_VERSION" >> $GITHUB_OUTPUT
              break
            fi

            PATCH=$((PATCH + 1))
          done

      - name: Update CHANGELOG.md
        id: changelog
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          VERSION="${{ steps.find_version.outputs.release_version }}"
          DATE=$(date -u +%Y-%m-%d)
          ENTRY_FILE=/tmp/changelog_entry.md

          {
            echo "## $VERSION ($DATE)"
            echo ""
            echo "* $PR_TITLE (#$PR_NUMBER)"
            if [ -n "$(printf '%s' "$PR_BODY" | tr -d '[:space:]')" ]; then
              echo ""
              printf '%s\n' "$PR_BODY" | sed 's/\r$//' | sed '/^[[:space:]]*$/d' | sed 's/^/* /'
            fi
            echo ""
          } > "$ENTRY_FILE"

          if [ -f CHANGELOG.md ]; then
            cat "$ENTRY_FILE" CHANGELOG.md > /tmp/CHANGELOG.md
            mv /tmp/CHANGELOG.md CHANGELOG.md
          else
            cp "$ENTRY_FILE" CHANGELOG.md
          fi

          {
            echo "release_notes<<EOF"
            cat "$ENTRY_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update pubspec.yaml and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          RELEASE_VERSION="${{ steps.find_version.outputs.release_version }}"

          if [ "$RELEASE_VERSION" != "$CURRENT_VERSION" ]; then
            sed -i "s/^version: .*/version: $RELEASE_VERSION/" pubspec.yaml
          fi

          git add CHANGELOG.md pubspec.yaml
          git commit -m "chore: bump version to $RELEASE_VERSION and update CHANGELOG [skip ci]"
          git push origin main

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.find_version.outputs.release_version }}
          name: v${{ steps.find_version.outputs.release_version }}
          body: ${{ steps.changelog.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
