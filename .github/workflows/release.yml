name: Create Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          dart-version: "3.9.2"

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Find available version
        id: find_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Split version into parts
          IFS='.' read -r -a PARTS <<< "$VERSION"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"

          # Find first available version
          while true; do
            TEST_VERSION="$MAJOR.$MINOR.$PATCH"
            TEST_TAG="v$TEST_VERSION"
            
            # Check if tag exists using GitHub API
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TEST_TAG" 2>/dev/null)
            
            if [ "$RESPONSE" != "200" ]; then
              echo "release_version=$TEST_VERSION" >> $GITHUB_OUTPUT
              echo "Found available version: $TEST_VERSION"
              break
            fi
            
            echo "Version $TEST_VERSION already exists, trying next..."
            PATCH=$((PATCH + 1))
          done

      - name: Update pubspec.yaml with new version
        if: steps.find_version.outputs.release_version != steps.get_version.outputs.version
        run: |
          NEW_VERSION="${{ steps.find_version.outputs.release_version }}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "Updated pubspec.yaml to version $NEW_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || exit 0
          git push origin main || echo "Nothing to push or push failed"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.find_version.outputs.release_version }}
          name: v${{ steps.find_version.outputs.release_version }}
          body: |
            ## Changes in this release

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **Version:** ${{ steps.find_version.outputs.release_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
