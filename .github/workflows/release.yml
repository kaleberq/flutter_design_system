name: Release Workflow

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find available version
        id: find_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          IFS='.' read -r -a PARTS <<< "$VERSION"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"

          while true; do
            TEST_VERSION="$MAJOR.$MINOR.$PATCH"
            TEST_TAG="v$TEST_VERSION"
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TEST_TAG" 2>/dev/null)
            
            if [ "$RESPONSE" != "200" ]; then
              echo "release_version=$TEST_VERSION" >> $GITHUB_OUTPUT
              break
            fi
            
            PATCH=$((PATCH + 1))
          done

      - name: Update pubspec.yaml and commit
        if: steps.find_version.outputs.release_version != steps.get_version.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version: .*/version: ${{ steps.find_version.outputs.release_version }}/" pubspec.yaml
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.find_version.outputs.release_version }} [skip ci]"
          git push origin main

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.find_version.outputs.release_version }}
          name: v${{ steps.find_version.outputs.release_version }}
          body: |
            ## Changes in this release

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **Version:** ${{ steps.find_version.outputs.release_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
